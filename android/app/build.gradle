plugins {
    id 'com.android.application'
}

def productionServer = 'https://nutriscan-six-theta.vercel.app'
def debugServer = providers.gradleProperty('nutriscanServer').orElse(productionServer).get()

android {
    namespace 'com.nutriscan.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nutriscan.mobile'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
        buildConfigField 'String', 'DEFAULT_SERVER', groovy.json.JsonOutput.toJson(productionServer)
    }

    buildTypes {
        debug {
            manifestPlaceholders = [allowCleartextTraffic: 'true']
            buildConfigField 'String', 'DEFAULT_SERVER', groovy.json.JsonOutput.toJson(debugServer)
        }
        release {
            debuggable false
            manifestPlaceholders = [allowCleartextTraffic: 'false']
        }
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
